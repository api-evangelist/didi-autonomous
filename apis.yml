name: DiDi Autonomous
description: 'DiDi Autonomous Driving (滴滴自动驾驶) is the autonomous-driving subsidiary of Chinese mobility
  giant DiDi. Founded as an internal research unit in 2016 and spun out as an independent company in 2019,
  it develops Level 4 self-driving technology and operates robotaxi services integrated into the DiDi
  ride-hailing platform in Chinese cities including Shanghai and Guangzhou. In 2020 SoftBank Vision Fund
  led a roughly $500M funding round into the unit. As a hardware- and fleet-oriented autonomous mobility
  operator it does not currently publish a public developer or API surface; this profile tracks it as a
  SoftBank Vision Fund portfolio company in the API Evangelist network.'
